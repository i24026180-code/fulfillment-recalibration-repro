name: aggregate-validation
on: [push, pull_request, workflow_dispatch]
jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-review-lock.txt
      - run: python scripts/validate_revision.py
      - run: python scripts/rebuild_core_tables.py --out build/core
      - run: python -m pytest -q
      - run: python scripts/audit_public_files.py
# This workflow validates supplied aggregates; it does not download raw data or
# certify unseen/private record-level models. It has not been run on GitHub here.
